<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><title>Metronome</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#0b1220;color:#edf4ff}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px}main{width:min(100%,440px);background:#111d30;border:1px solid #263b53;border-radius:28px;padding:28px;box-shadow:0 18px 65px #0005}header{text-align:center;color:#a9c0d4;letter-spacing:.18em;text-transform:uppercase;font-size:12px}h1{text-align:center;font-size:clamp(72px,20vw,104px);font-weight:600;letter-spacing:-.06em;margin:24px 0 0;font-variant-numeric:tabular-nums}small{display:block;text-align:center;color:#9db4c9;letter-spacing:.16em} .pulse{width:22px;height:22px;border-radius:50%;background:#45657d;margin:30px auto;transition:transform .09s,background .09s,box-shadow .09s}.pulse.on{background:#78d6ca;transform:scale(1.55);box-shadow:0 0 28px #78d6ca77}.controls{display:flex;align-items:center;gap:12px;margin:24px 0}button,select{font:inherit;color:inherit;border:1px solid #35506b;background:#1c3047;border-radius:14px;min-height:48px}button{cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #78d6ca;outline-offset:3px}.step{width:56px;font-size:25px}.quick{display:flex;justify-content:center;gap:12px;margin-top:-8px;margin-bottom:18px}.quick button{min-width:84px;padding:0 18px;font-weight:650}input[type=range]{flex:1;min-width:0;accent-color:#78d6ca}#play{width:100%;background:#78d6ca;color:#0b2029;border:0;font-weight:750;font-size:19px;min-height:64px} .row{display:flex;gap:12px;margin-top:14px}.row>*{flex:1;min-width:0}#tap{background:#243b54}label{display:block;font-size:12px;color:#a9c0d4;margin:22px 0 8px}select{width:100%;padding:0 12px}footer{text-align:center;color:#829bb0;font-size:12px;margin-top:22px}.beats{display:flex;justify-content:center;gap:12px;margin:12px 0}.beat{height:8px;width:8px;border-radius:50%;background:#3b5269}.beat.active{background:#78d6ca} 
</style></head><body><main><header>Metronome</header><h1 id="value">120</h1><small>BEATS PER MINUTE</small><div id="pulse" class="pulse" aria-hidden="true"></div><div id="beats" class="beats" aria-hidden="true"></div><div class="controls"><button class="step" id="minus" aria-label="Decrease tempo">−</button><input id="tempo" type="range" min="30" max="240" value="120" aria-label="Tempo in beats per minute"><button class="step" id="plus" aria-label="Increase tempo">+</button></div><div class="quick"><button id="minus5" aria-label="Decrease tempo by five">−5</button><button id="plus5" aria-label="Increase tempo by five">+5</button></div><button id="play">Start</button><div class="row"><button id="tap">Tap tempo</button><button id="mute" aria-pressed="false">Sound on</button></div><label for="sound">Metronome sound</label><select id="sound"><option value="classic" selected>Classic electronic (original)</option><option value="wood">Mechanical tick-tock</option><option value="digital">Digital click</option><option value="soft">Soft pulse</option><option value="bell">Bell</option></select><label for="meter">Time signature</label><select id="meter"><option value="2">2/4</option><option value="3">3/4</option><option value="4" selected>4/4</option><option value="6">6/8</option></select><footer>Tap tempo at least twice · Works offline after loading</footer></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),tempo=$('tempo'),value=$('value'),play=$('play'),pulse=$('pulse'),beats=$('beats'),meter=$('meter'),sound=$('sound');let bpm=120,running=false,muted=false,ctx=null,next=0,beat=0,timer=null,taps=[],flashTimer=null;const interval=()=>60/bpm;function drawBeats(){beats.replaceChildren(...Array.from({length:+meter.value},()=>{const d=document.createElement('span');d.className='beat';return d}))}function setBpm(n){bpm=Math.max(30,Math.min(240,Math.round(n)));tempo.value=bpm;value.textContent=bpm;if(running){next=ctx.currentTime+.05;beat=0}}let soundMode='classic';try{soundMode=localStorage.getItem('metronomeSound')||'classic'}catch(e){}if([...sound.options].some(o=>o.value===soundMode))sound.value=soundMode;else soundMode='classic';sound.onchange=()=>{soundMode=sound.value;try{localStorage.setItem('metronomeSound',soundMode)}catch(e){}};let noiseBuffer=null;function makeNoise(){if(noiseBuffer)return;noiseBuffer=ctx.createBuffer(1,Math.ceil(ctx.sampleRate*.045),ctx.sampleRate);const data=noiseBuffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1}function tone(t,freq,endFreq,duration,level,type='sine'){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);if(endFreq!==freq)o.frequency.exponentialRampToValueAtTime(endFreq,t+duration*.65);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(level,t+.003);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+duration+.005)}function clickAt(t,accent,idx){if(muted)return;const mode=soundMode;if(mode==='classic'){tone(t,accent?1100:760,accent?650:480,.075,accent?.26:.16);return}if(mode==='digital'){tone(t,accent?1600:1150,accent?1150:850,.024,accent?.23:.16,'square');return}if(mode==='soft'){tone(t,accent?520:410,accent?310:260,.09,accent?.17:.12,'sine');return}if(mode==='bell'){tone(t,accent?1320:880,accent?1320:880,.23,accent?.15:.10,'sine');tone(t,accent?2640:1760,accent?2640:1760,.13,accent?.035:.025,'sine');return}makeNoise();const noise=ctx.createBufferSource(),filter=ctx.createBiquadFilter(),env=ctx.createGain();noise.buffer=noiseBuffer;filter.type='bandpass';filter.frequency.value=accent?1650:(idx%2?1150:1350);filter.Q.value=.85;env.gain.setValueAtTime(.0001,t);env.gain.linearRampToValueAtTime(accent?.48:.32,t+.0015);env.gain.exponentialRampToValueAtTime(.0001,t+.032);noise.connect(filter);filter.connect(env);env.connect(ctx.destination);noise.start(t);noise.stop(t+.035);tone(t,accent?820:(idx%2?590:680),accent?340:290,.042,accent?.22:.14,'triangle')}function schedule(){if(!running||!ctx)return;while(next<ctx.currentTime+.12){const at=next,idx=beat;clickAt(at,idx===0,idx);const delay=Math.max(0,(at-ctx.currentTime)*1000);setTimeout(()=>{if(!running)return;pulse.classList.add('on');[...beats.children].forEach((el,i)=>el.classList.toggle('active',i===idx));clearTimeout(flashTimer);flashTimer=setTimeout(()=>pulse.classList.remove('on'),95)},delay);next+=interval();beat=(beat+1)%+meter.value}}async function start(){try{ctx??=new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();running=true;next=ctx.currentTime+.04;beat=0;play.textContent='Stop';timer=setInterval(schedule,25);schedule()}catch(e){play.textContent='Audio unavailable';console.error(e)}}function stop(){running=false;clearInterval(timer);clearTimeout(flashTimer);pulse.classList.remove('on');[...beats.children].forEach(x=>x.classList.remove('active'));play.textContent='Start'}play.onclick=()=>running?stop():start();tempo.oninput=()=>setBpm(tempo.value);$('minus').onclick=()=>setBpm(bpm-1);$('plus').onclick=()=>setBpm(bpm+1);$('minus5').onclick=()=>setBpm(bpm-5);$('plus5').onclick=()=>setBpm(bpm+5);meter.onchange=()=>{beat=0;drawBeats()};$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'Sound off':'Sound on';$('mute').setAttribute('aria-pressed',String(muted))};$('tap').onclick=()=>{const now=performance.now();if(taps.length&&now-taps.at(-1)>2200)taps=[];taps.push(now);if(taps.length>6)taps.shift();if(taps.length>=2){const gaps=taps.slice(1).map((t,i)=>t-taps[i]);setBpm(60000/(gaps.reduce((a,b)=>a+b,0)/gaps.length))}};document.addEventListener('visibilitychange',()=>{if(document.hidden&&running)stop()});drawBeats()})();
</script></body></html>
